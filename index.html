<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industrial TrackPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    @keyframes pulse-subtle {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.7;
      }
    }

    .animate-pulse-subtle {
      animation: pulse-subtle 3s infinite ease-in-out;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900">
  <div id="root">
    <div
      style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f8fafc; color: #334155; font-family: sans-serif;">
      <h1 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem;">Caricamento Applicazione...</h1>
      <p>Attendere prego. Se questo messaggio rimane fisso, prova a ricaricare.</p>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
