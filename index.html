<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industrial TrackPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    @keyframes pulse-subtle {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.7;
      }
    }

    .animate-pulse-subtle {
      animation: pulse-subtle 3s infinite ease-in-out;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-slate-50 text-slate-900">
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      document.body.innerHTML = '<div style="background:black;color:red;padding:20px;font-family:monospace;white-space:pre-wrap;height:100vh;"><h1>CRITICAL ERROR</h1>' +
        'message: ' + message + '\n' +
        'source: ' + source + '\n' +
        'lineno: ' + lineno + '\n' +
        'colno: ' + colno + '\n' +
        'error: ' + (error ? error.stack : 'N/A') +
        '</div>';
    };
    window.addEventListener('unhandledrejection', function (event) {
      document.body.innerHTML = '<div style="background:black;color:red;padding:20px;font-family:monospace;white-space:pre-wrap;height:100vh;"><h1>UNHANDLED PROMISE REJECTION</h1>' +
        'reason: ' + event.reason +
        '</div>';
    });
  </script>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
